<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PB Radio FM</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .player-card {
      background-color: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 { margin-top: 0; font-size: 1.2rem; color: #b3b3b3; }
    .track-title { font-size: 1.4rem; font-weight: bold; margin: 15px 0; color: #1db954; }
    audio { width: 100%; margin: 15px 0; }
    .playlist {
      list-style: none;
      padding: 0;
      margin-top: 20px;
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
    }
    .playlist li {
      padding: 10px 12px;
      border-bottom: 1px solid #282828;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .playlist li:hover { background-color: #282828; }
    .playlist li.active { color: #1db954; font-weight: bold; background-color: #282828; }
  </style>
</head>
<body>

<div class="player-card">
  <h2>Web Player</h2>
  <div class="track-title" id="currentTrackTitle">Lade Titel...</div>
  
  <audio id="audioPlayer" controls autoplay></audio>

  <ul class="playlist" id="playlist"></ul>
</div>

<script>
  // Hier tragen Sie die Dateinamen Ihrer MP3s aus dem "music"-Ordner ein:
 const songs = [
    { title: "Audio 1", file: "audio1.mp3" }
  ];

  let currentIndex = 0;
  const audioPlayer = document.getElementById('audioPlayer');
  const trackTitle = document.getElementById('currentTrackTitle');
  const playlistElement = document.getElementById('playlist');

  function renderPlaylist() {
    playlistElement.innerHTML = '';
    songs.forEach((song, index) => {
      const li = document.createElement('li');
      li.textContent = `${index + 1}. ${song.title}`;
      if (index === currentIndex) li.classList.add('active');
      li.onclick = () => loadAndPlay(index);
      playlistElement.appendChild(li);
    });
  }

  function loadAndPlay(index) {
    currentIndex = index;
    audioPlayer.src = songs[currentIndex].file;
    trackTitle.textContent = songs[currentIndex].title;
    renderPlaylist();
    audioPlayer.play().catch(() => {});
  }

  audioPlayer.onended = () => {
    currentIndex = (currentIndex + 1) % songs.length;
    loadAndPlay(currentIndex);
  };

  loadAndPlay(0);
</script>

</body>
</html>
