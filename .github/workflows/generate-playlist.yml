name: Generate Playlist

on:
  push:
    paths:
      - 'music/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Generate playlist.json
        run: |
          echo "[" > playlist.json
          first=true
          for file in music/*.mp3; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              title="${filename%.*}"
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> playlist.json
              fi
              echo "  {\"title\": \"$title\", \"file\": \"$file\"}" >> playlist.json
            fi
          done
          echo "]" >> playlist.json

      - name: Commit playlist.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.json
          git commit -m "Auto-update playlist.json" || exit 0
          git push
